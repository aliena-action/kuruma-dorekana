name: Weekly usage report

on:
  schedule:
    # Every Monday at 09:00 JST. Change this cron to adjust the schedule.
    - cron: "0 9 * * 1"
      timezone: "Asia/Tokyo"
  workflow_dispatch:
    inputs:
      subject:
        description: Optional subject for a one-off verification email
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: weekly-usage-report
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Validate report configuration
        env:
          REPORT_ENDPOINT: ${{ vars.FEEDBACK_REPORT_ENDPOINT }}
          REPORT_ADMIN_TOKEN: ${{ secrets.REPORT_ADMIN_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$REPORT_ENDPOINT"
          test -n "$REPORT_ADMIN_TOKEN"
          [[ "$REPORT_ENDPOINT" == https://* ]]
          [[ "$REPORT_ENDPOINT" != *\?* ]]
          [[ "$REPORT_ENDPOINT" != *\#* ]]
          [[ ${#REPORT_ADMIN_TOKEN} -ge 32 ]]

      - name: Generate and send the weekly usage report
        env:
          REPORT_ENDPOINT: ${{ vars.FEEDBACK_REPORT_ENDPOINT }}
          REPORT_ADMIN_TOKEN: ${{ secrets.REPORT_ADMIN_TOKEN }}
          REPORT_SUBJECT: ${{ inputs.subject }}
        shell: bash
        run: |
          set -euo pipefail
          payload='{"action":"send_weekly"}'
          if [[ -n "$REPORT_SUBJECT" ]]; then
            payload="$(
              jq -cn \
                --arg subject "$REPORT_SUBJECT" \
                '{action:"send_weekly",subject:$subject}'
            )"
          fi
          status="$(
            curl --silent --show-error \
              --output "$RUNNER_TEMP/feedback-report-result.json" \
              --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer $REPORT_ADMIN_TOKEN" \
              --header 'Content-Type: application/json' \
              --data "$payload" \
              "$REPORT_ENDPOINT"
          )"
          if [[ "$status" != 2* ]]; then
            echo "Weekly usage report failed with HTTP $status."
            exit 1
          fi
          echo "Weekly usage report request completed."
